name: Build and Deploy

on:
  push:
    branches: [trunk]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      wb_release:
        description: "Pin to a specific WormBase release (e.g. WS298). Leave empty for auto-latest."
        required: false
        default: ""
      force_refresh:
        description: "Ignore the data cache and re-fetch every source."
        type: boolean
        default: false
      disable_kegg:
        description: "Exclude KEGG pathway data from the build (license). Overrides the DISABLE_KEGG repo variable for this run."
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WB_RELEASE: ${{ github.event.inputs.wb_release }}
  # An unticked input arrives as the string 'false', which is truthy and would
  # otherwise mask the repo variable on every manual run.
  DISABLE_KEGG: ${{ github.event.inputs.disable_kegg == 'true' && '1' || vars.DISABLE_KEGG }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build-db.sh needs numpy for the CeNGEN co-expression neighbours.
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve WB release
        id: wb
        run: |
          echo "release=${WB_RELEASE:-WS298}" >> "$GITHUB_OUTPUT"
          # ISO week stamp so the always-latest sources (GO/Alliance/BioGRID)
          # get re-fetched at least weekly.
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      # No restore-keys: a prefix fallback would restore an arbitrarily old .cache,
      # and build-db.sh skips any source it already has, so a "weekly" build could
      # publish months-old GO and BioGRID files.
      - name: Cache data sources
        if: ${{ github.event.inputs.force_refresh != 'true' }}
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}

      - name: DB cache key
        id: db-key
        run: echo "key=db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}-${{ hashFiles('scripts/build-db.sh', 'data/**') }}" >> "$GITHUB_OUTPUT"

      # Restore and save are split because the stash step below moves the DB out of
      # static/data before the job ends, so an end-of-job save found nothing and every
      # push rebuilt the DB under a new version, making every visitor download it again.
      - name: Restore built DB output
        id: db-cache
        if: ${{ github.event_name == 'push' && github.event.inputs.force_refresh != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            static/data/wormie.sqlite.gz
            static/data/wormie.sqlite.zst
            static/data/version.json
            static/data/unresolved-symbols.txt
          key: ${{ steps.db-key.outputs.key }}
          restore-keys: |
            db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}-
            db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}

      - name: Build DB
        if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
        env:
          # The weekly run exists to refresh the moving sources, so it ignores the cache.
          FORCE_REFRESH: ${{ (github.event_name == 'schedule' || github.event.inputs.force_refresh == 'true') && '1' || '' }}
        run: bun run build-db

      - name: Typecheck
        run: bun run check

      - name: Stash DB for R2 upload
        run: |
          set -euo pipefail
          mkdir -p deploy-data
          ls -lh static/data/
          # A cache restored from before the zstd copy existed has only the .gz:
          # derive the .zst and advertise it so every deploy ships both.
          if [ ! -f static/data/wormie.sqlite.zst ]; then
            command -v zstd >/dev/null || { echo "::error::zstd not found on the runner"; exit 1; }
            gunzip -c static/data/wormie.sqlite.gz | zstd -19 -T0 -q -f -o static/data/wormie.sqlite.zst
          fi
          python3 - <<'PY'
          import json, os
          p = "static/data/version.json"
          d = json.load(open(p))
          d["zst_file"] = "wormie.sqlite.zst"
          d["zst_size"] = os.path.getsize("static/data/wormie.sqlite.zst")
          json.dump(d, open(p, "w"), indent=2)
          PY
          mv static/data/wormie.sqlite.gz deploy-data/
          [ -f static/data/wormie.sqlite.zst ] && mv static/data/wormie.sqlite.zst deploy-data/ || true
          mv static/data/version.json deploy-data/
          [ -f static/data/annotation.saf.gz ] && mv static/data/annotation.saf.gz deploy-data/ || true
          [ -f static/data/unresolved-symbols.txt ] && mv static/data/unresolved-symbols.txt deploy-data/ || true
          ls -lh deploy-data/

      - name: Build SvelteKit
        run: bun run build

      # Only the deploy job of this run reads these, and the DB copy is about 200 MB a run.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 1

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-data
          path: deploy-data
          retention-days: 1
          if-no-files-found: error

      - name: Put the DB back for the cache save
        if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          cp deploy-data/wormie.sqlite.gz deploy-data/version.json static/data/
          [ -f deploy-data/wormie.sqlite.zst ] && cp deploy-data/wormie.sqlite.zst static/data/ || true
          [ -f deploy-data/unresolved-symbols.txt ] && cp deploy-data/unresolved-symbols.txt static/data/ || true

      # Scheduled builds save too, so pushes later in the week reuse the Monday build.
      - name: Save built DB output
        if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            static/data/wormie.sqlite.gz
            static/data/wormie.sqlite.zst
            static/data/version.json
            static/data/unresolved-symbols.txt
          key: ${{ steps.db-key.outputs.key }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-data
          path: deploy-data

      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          BUCKET=wormie-data
          out="$(bunx wrangler@4 r2 bucket create "$BUCKET" 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          echo "$out" | grep -qiE 'already (exists|owned)|10004' \
            && { echo "R2 bucket $BUCKET already exists, continuing"; exit 0; }
          echo "Failed to create R2 bucket $BUCKET" >&2
          exit 1

      - name: Upload DB + version.json to R2 (S3 multipart)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2_S3_ACCESS_KEY_ID / R2_S3_SECRET_ACCESS_KEY not set. Create an R2 Account API token (Object Read & Write on wormie-data); its creation screen shows both values." >&2
            exit 1
          fi
          command -v aws >/dev/null || { echo "::error::aws CLI not found on the runner (expected pre-installed on ubuntu-latest)."; exit 1; }
          aws --version
          if ! aws s3api head-bucket --bucket wormie-data --endpoint-url "$R2_ENDPOINT" 2>head.err; then
            cat head.err >&2
            echo "::error::R2 S3 auth failed. Check the R2_S3_* secrets match an R2 token with Object Read & Write on wormie-data." >&2
            exit 1
          fi
          aws s3 cp deploy-data/wormie.sqlite.gz "s3://wormie-data/wormie.sqlite.gz" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/gzip
          # Before version.json: it must never point at a file not yet uploaded.
          if [ -f deploy-data/wormie.sqlite.zst ]; then
            aws s3 cp deploy-data/wormie.sqlite.zst "s3://wormie-data/wormie.sqlite.zst" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/zstd
          fi
          aws s3 cp deploy-data/version.json "s3://wormie-data/version.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json
          if [ -f deploy-data/annotation.saf.gz ]; then
            aws s3 cp deploy-data/annotation.saf.gz "s3://wormie-data/annotation.saf.gz" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/gzip
          fi
          # Item 19: the full unresolved-panel-symbol list must survive the build
          # and be inspectable next to the database it describes.
          if [ -f deploy-data/unresolved-symbols.txt ]; then
            aws s3 cp deploy-data/unresolved-symbols.txt "s3://wormie-data/unresolved-symbols.txt" \
              --endpoint-url "$R2_ENDPOINT" --content-type "text/plain; charset=utf-8"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4"
          command: deploy
