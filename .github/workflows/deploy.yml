name: Build and Deploy

on:
  push:
    branches: [trunk]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      wb_release:
        description: "Pin to a specific WormBase release (e.g. WS298). Leave empty for auto-latest."
        required: false
        default: ""
      force_refresh:
        description: "Ignore the data cache and re-fetch every source."
        type: boolean
        default: false
      disable_kegg:
        description: "Exclude KEGG pathway data from the build (license). Overrides the DISABLE_KEGG repo variable for this run."
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WB_RELEASE: ${{ github.event.inputs.wb_release }}
  DISABLE_KEGG: ${{ github.event.inputs.disable_kegg || vars.DISABLE_KEGG }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve WB release
        id: wb
        run: |
          if [[ -n "${WB_RELEASE:-}" ]]; then
            echo "release=$WB_RELEASE" >> "$GITHUB_OUTPUT"
          else
            R="$(curl -fsS --max-time 10 'https://ftp.ebi.ac.uk/pub/databases/wormbase/releases/' 2>/dev/null \
              | grep -oE 'WS[0-9]+' | sort -u -t S -k 2 -n | tail -1)"
            echo "release=${R:-WS298}" >> "$GITHUB_OUTPUT"
          fi
          # ISO week stamp so the always-latest sources (GO/Alliance/BioGRID)
          # get re-fetched at least weekly.
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache data sources
        if: ${{ github.event.inputs.force_refresh != 'true' }}
        uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}
          restore-keys: |
            data-${{ steps.wb.outputs.release }}-

      - name: Cache built DB output
        id: db-cache
        if: ${{ github.event_name == 'push' && github.event.inputs.force_refresh != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            static/data/wormie.sqlite.gz
            static/data/version.json
          key: db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}-${{ hashFiles('scripts/build-db.sh', 'data/**') }}
          restore-keys: |
            db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}-
            db-${{ steps.wb.outputs.release }}-${{ steps.wb.outputs.week }}-kegg${{ env.DISABLE_KEGG || 'on' }}

      - name: Build DB
        if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
        run: bun run build-db

      - name: Typecheck
        run: bun run check

      - name: Stash DB for R2 upload
        run: |
          set -euo pipefail
          mkdir -p deploy-data
          ls -lh static/data/
          mv static/data/wormie.sqlite.gz deploy-data/
          mv static/data/version.json deploy-data/
          ls -lh deploy-data/

      - name: Build SvelteKit
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-data
          path: deploy-data
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Download DB artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-data
          path: deploy-data

      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          BUCKET=wormie-data
          out="$(bunx wrangler@4 r2 bucket create "$BUCKET" 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          echo "$out" | grep -qiE 'already (exists|owned)|10004' \
            && { echo "R2 bucket $BUCKET already exists, continuing"; exit 0; }
          echo "Failed to create R2 bucket $BUCKET" >&2
          exit 1

      - name: Upload DB + version.json to R2 (S3 multipart)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "::error::R2_S3_ACCESS_KEY_ID is not set. Add it as a repo secret (the Access Key ID of the CF_API_TOKEN R2 token)." >&2
            exit 1
          fi
          command -v aws >/dev/null || { echo "::error::aws CLI not found on the runner (expected pre-installed on ubuntu-latest)."; exit 1; }
          aws --version
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "$CF_API_TOKEN" | sha256sum | cut -d' ' -f1)"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY
          if ! aws s3api head-bucket --bucket wormie-data --endpoint-url "$R2_ENDPOINT" 2>head.err; then
            cat head.err >&2
            echo "::error::R2 S3 auth failed. Check R2_S3_ACCESS_KEY_ID matches the CF_API_TOKEN R2 token (Object Read & Write on wormie-data)." >&2
            exit 1
          fi
          aws s3 cp deploy-data/wormie.sqlite.gz "s3://wormie-data/wormie.sqlite.gz" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/gzip
          aws s3 cp deploy-data/version.json "s3://wormie-data/version.json" \
            --endpoint-url "$R2_ENDPOINT" --content-type application/json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: "4"
          command: deploy
