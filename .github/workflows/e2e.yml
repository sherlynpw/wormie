name: E2E

# Runs the Playwright suite against the dev server, using the deployed database
# and WASM artifacts rather than building them. This is what catches a sender
# whose reader silently ignores the payload (see tests/e2e/connections.spec.ts);
# check/lint alone cannot.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Playwright 1.60 cannot install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The dev server needs the database present; fetch the deployed build
      # instead of spending an hour rebuilding it from sources.
      - name: Fetch deployed database
        run: |
          set -euo pipefail
          mkdir -p static/data
          retry=(--retry 4 --retry-delay 5 --retry-all-errors)
          curl -fsSL "${retry[@]}" -o static/data/version.json https://wormie.rs.ht/data/version.json
          curl -fsSL "${retry[@]}" -o static/data/wormie.sqlite.gz https://wormie.rs.ht/data/wormie.sqlite.gz
          # Absent until the first deploy that ships it; the client falls back to the .gz.
          curl -fsSL "${retry[@]}" -o static/data/wormie.sqlite.zst https://wormie.rs.ht/data/wormie.sqlite.zst || rm -f static/data/wormie.sqlite.zst
          # version.json advertises the bundled annotation, so /counts offers it; serve it too.
          curl -fsSL "${retry[@]}" -o static/data/annotation.saf.gz https://wormie.rs.ht/data/annotation.saf.gz
          ls -lh static/data/

      # The /de tests run real DESeq2 in WebR; the runtime and bundle live in
      # R2, mirrored locally by the sync script. Cached because they only
      # change when a bake or runtime upgrade does.
      - name: Cache WASM artifacts
        id: wasm-cache
        uses: actions/cache@v4
        with:
          path: scripts/wasm-cran
          key: e2e-wasm-${{ hashFiles('scripts/wasm-build/sync-webr-runtime.sh') }}

      - name: Sync WebR runtime and DESeq2 bundle
        if: ${{ steps.wasm-cache.outputs.cache-hit != 'true' }}
        run: bash scripts/wasm-build/sync-webr-runtime.sh

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e suite
        run: bun run test:e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
