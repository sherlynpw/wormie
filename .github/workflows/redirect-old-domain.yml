name: Redirect wormie.rs.ht

# Runs only after a successful deploy, and only once wormie.bio answers, so the
# old domain never points at a site that is not up yet.
on:
  workflow_run:
    workflows: ['Build and Deploy']
    types: [completed]
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: redirect-old-domain
  cancel-in-progress: true

jobs:
  redirect:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check wormie.bio is live
        run: |
          set -euo pipefail
          retry=(--retry 5 --retry-delay 10 --retry-all-errors)
          curl -fsS "${retry[@]}" -o /dev/null https://wormie.bio/
          curl -fsS "${retry[@]}" https://wormie.bio/data/version.json | python3 -c 'import json,sys; json.load(sys.stdin)'
          # The worker streams R2 bodies without a content-length, so check the gzip magic bytes.
          magic=$({ curl -fsS https://wormie.bio/data/wormie.sqlite.gz 2>/dev/null || true; } | head -c 2 | od -An -tx1 | tr -d ' \n')
          [ "$magic" = 1f8b ] || { echo "::error::wormie.bio/data/wormie.sqlite.gz is not gzip (got '$magic')" >&2; exit 1; }
          curl -fsS "${retry[@]}" -o /dev/null https://wormie.bio/wasm-cran/deseq2-bundle.manifest.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy redirect to the old Cloudflare account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OLD_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.OLD_CF_ACCOUNT_ID }}
        working-directory: redirect
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::OLD_CF_API_TOKEN / OLD_CF_ACCOUNT_ID not set. Add a Workers edit token for the account that holds wormie.rs.ht." >&2
            exit 1
          fi
          bunx wrangler@4 deploy

      - name: Check the redirect
        run: |
          set -euo pipefail
          loc="$(curl -fsSI --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null -w '%{redirect_url}' 'https://wormie.rs.ht/gene/WBGene00000001?x=1' || true)"
          echo "redirect_url=$loc"
          [ "$loc" = "https://wormie.bio/gene/WBGene00000001?x=1" ]
